AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  TradeFlow Colon P0: low-cost EC2 application host, private PostgreSQL RDS,
  encrypted backup bucket, ECR repository, SSM access, and basic alarms.

Parameters:
  EnvironmentName:
    Type: String
    Default: tradeflow-p0
    AllowedPattern: '[a-z0-9-]+'
  AlertEmail:
    Type: String
    Description: Email that must confirm the SNS alarm subscription.
  AppInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues:
      - db.t4g.micro
      - db.t4g.small
  DatabaseStorageGiB:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
  DatabaseDeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'
    Description: >-
      Keep false during the initial empty deployment so a failed creation can
      roll back cleanly. Change to true after the migrated data is validated.
  AppAllowedHosts:
    Type: String
    Default: tradeflowcolon.com,www.tradeflowcolon.com,.compute.amazonaws.com
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  AppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.10.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-app-public'

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.20.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-private-a'

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.42.21.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-private-b'

  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-app-routes'

  AppDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref AppRouteTable

  AppRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref AppRouteTable
      SubnetId: !Ref AppSubnet

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP and HTTPS for the TradeFlow web origin.
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-app-sg'

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL reachable only from the TradeFlow app host.
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-sg'

  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-backups'

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-media'
        - Key: DataClassification
          Value: public-catalog-private-origin

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub '${MediaBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  AppRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: false
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep ten images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}
      RepositoryName: tradeflow-colon
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-images'

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for TradeFlow PostgreSQL.
      SubnetIds:
        - !Ref DatabaseSubnetA
        - !Ref DatabaseSubnetB
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-subnets'

  DatabaseParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Force encrypted PostgreSQL connections.
      Family: postgres17
      Parameters:
        rds.force_ssl: '1'

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AllocatedStorage: !Ref DatabaseStorageGiB
      AutoMinorVersionUpgrade: true
      # AWS Free Plan accounts created after July 15, 2025 reject any
      # non-zero automated-backup retention. Logical PostgreSQL backups are
      # stored encrypted and versioned in the BackupBucket instead.
      BackupRetentionPeriod: 0
      CopyTagsToSnapshot: true
      DBInstanceClass: !Ref DatabaseInstanceClass
      DBName: tradeflow
      DBParameterGroupName: !Ref DatabaseParameterGroup
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DeletionProtection: !Ref DatabaseDeletionProtection
      Engine: postgres
      EngineVersion: '17'
      MasterUsername: tradeflow_admin
      ManageMasterUserPassword: true
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: true
      StorageType: gp3
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-postgres'

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: TradeFlowRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt AppRepository.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${BackupBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt MediaBucket.Arn
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${MediaBucket.Arn}/*'

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AppRole

  AppInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - AppDefaultRoute
      - Database
    Properties:
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref AppInstanceProfile
      InstanceType: !Ref AppInstanceType
      MetadataOptions:
        HttpEndpoint: enabled
        # Docker adds one network hop. IMDSv2 remains mandatory, while boto3
        # inside the container can obtain short-lived AppRole credentials.
        HttpPutResponseHopLimit: 2
        HttpTokens: required
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      SubnetId: !Ref AppSubnet
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 20
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-app'
        - Key: Role
          Value: tradeflow-app
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker nginx jq openssl
          systemctl enable --now docker
          systemctl enable --now amazon-ssm-agent

          if [[ ! -f /swapfile ]]; then
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >>/etc/fstab
          fi

          mkdir -p /opt/tradeflow/media
          chmod 700 /opt/tradeflow

          if [[ ! -f /opt/tradeflow/secret_key ]]; then
            openssl rand -hex 48 >/opt/tradeflow/secret_key
            chmod 600 /opt/tradeflow/secret_key
          fi

          openssl req -x509 -nodes -newkey rsa:2048 -days 90 \
            -keyout /etc/pki/tls/private/tradeflow-origin.key \
            -out /etc/pki/tls/certs/tradeflow-origin.crt \
            -subj '/CN=tradeflowcolon.com'

          cat >/etc/nginx/conf.d/tradeflow.conf <<'NGINX'
          map $http_x_forwarded_proto $tradeflow_forwarded_proto {
              default $http_x_forwarded_proto;
              "" $scheme;
          }

          server {
              listen 80 default_server;
              listen 443 ssl default_server;
              server_name _;

              ssl_certificate /etc/pki/tls/certs/tradeflow-origin.crt;
              ssl_certificate_key /etc/pki/tls/private/tradeflow-origin.key;

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $tradeflow_forwarded_proto;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }
          NGINX
          rm -f /etc/nginx/conf.d/default.conf
          nginx -t
          systemctl enable --now nginx

          cat >/usr/local/bin/tradeflow-deploy.sh <<'DEPLOY'
          #!/bin/bash
          set -Eeuo pipefail
          umask 077

          if [[ "$#" -ne 1 ]]; then
            echo 'Uso: tradeflow-deploy.sh ECR_IMAGE_URI' >&2
            exit 2
          fi
          image_uri="$1"
          region='${AWS::Region}'
          registry='${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'
          db_secret_arn='${Database.MasterUserSecret.SecretArn}'
          db_host='${Database.Endpoint.Address}'
          db_port='${Database.Endpoint.Port}'
          db_name='tradeflow'

          secret_json="$(aws secretsmanager get-secret-value \
            --region "$region" \
            --secret-id "$db_secret_arn" \
            --query SecretString \
            --output text)"
          db_user="$(printf '%s' "$secret_json" | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["username"])')"
          db_password="$(printf '%s' "$secret_json" | python3 -c \
            'import json,sys,urllib.parse; print(urllib.parse.quote(json.load(sys.stdin)["password"], safe=""))')"

          cat >/opt/tradeflow/runtime.env <<ENVIRONMENT
          SECRET_KEY=$(cat /opt/tradeflow/secret_key)
          DEBUG=false
          ALLOWED_HOSTS=${AppAllowedHosts}
          DATABASE_URL=postgresql://$db_user:$db_password@$db_host:$db_port/$db_name
          DB_SSL=true
          DB_SSLMODE=require
          PORT=8080
          AWS_MEDIA_BUCKET_NAME=${MediaBucket}
          AWS_MEDIA_REGION_NAME=${AWS::Region}
          AWS_MEDIA_URL_EXPIRY=3600
          SERVE_LOCAL_MEDIA=false
          USE_DB_CACHE=false
          ENVIRONMENT

          aws ecr get-login-password --region "$region" \
            | docker login --username AWS --password-stdin "$registry"
          docker pull "$image_uri"
          docker rm --force tradeflow-web 2>/dev/null || true
          docker run --detach \
            --name tradeflow-web \
            --restart unless-stopped \
            --env-file /opt/tradeflow/runtime.env \
            --publish 127.0.0.1:8080:8080 \
            --volume /opt/tradeflow/media:/app/media \
            "$image_uri"

          for attempt in {1..30}; do
            if curl --fail --silent --header 'Host: tradeflowcolon.com' \
              http://127.0.0.1/health/live/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs --tail 100 tradeflow-web
          exit 1
          DEPLOY
          chmod 700 /usr/local/bin/tradeflow-deploy.sh

  AppElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref AppInstance
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-origin-ip'

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: TradeFlow AWS alarms
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  AppCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref AlarmTopic
      AlarmDescription: EC2 CPU above 80 percent for ten minutes.
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref AppInstance
      EvaluationPeriods: 2
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Period: 300
      Statistic: Average
      Threshold: 80
      TreatMissingData: notBreaching

  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref AlarmTopic
      AlarmDescription: RDS CPU above 80 percent for ten minutes.
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      EvaluationPeriods: 2
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      Period: 300
      Statistic: Average
      Threshold: 80
      TreatMissingData: notBreaching

  DatabaseStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref AlarmTopic
      AlarmDescription: RDS free storage below 5 GiB.
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      EvaluationPeriods: 1
      MetricName: FreeStorageSpace
      Namespace: AWS/RDS
      Period: 300
      Statistic: Average
      Threshold: 5368709120
      TreatMissingData: breaching

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      ClientIdList:
        - sts.amazonaws.com
      Url: https://token.actions.githubusercontent.com

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action:
              - sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: >-
                  repo:abdiel-ariano/Tradeflow_colon:environment:aws-staging
      Policies:
        - PolicyName: TradeFlowImageAndDeploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt AppRepository.Arn
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:SendCommand
                Resource: '*'

Outputs:
  AppElasticIp:
    Description: Stable origin IP. Do not change Cloudflare until validation passes.
    Value: !Ref AppElasticIp
  AppInstanceId:
    Value: !Ref AppInstance
  BackupBucketName:
    Value: !Ref BackupBucket
  MediaBucketName:
    Description: Private bucket for seller-uploaded product media.
    Value: !Ref MediaBucket
  DatabaseEndpoint:
    Description: Private endpoint; reachable only from the EC2 security group.
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  EcrRepositoryUri:
    Value: !GetAtt AppRepository.RepositoryUri
  GitHubDeployRoleArn:
    Description: Store as the AWS_ROLE_TO_ASSUME GitHub environment variable.
    Value: !GetAtt GitHubDeployRole.Arn
