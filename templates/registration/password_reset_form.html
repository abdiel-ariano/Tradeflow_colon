{% extends "core/base.html" %}
{% load static %}
{% block title %}Reset password — TradeFlow{% endblock %}
{% block content %}
<div class="tf-centered-form" style="max-width:420px;margin:48px auto;">
  <div class="sp-card" style="padding:28px;">
    <h1 style="font-family:'DM Serif Display',serif;color:var(--tf-navy);margin:0 0 8px;">Recover access</h1>
    <p style="color:var(--tf-muted);font-size:14px;margin:0 0 20px;">We will send a secure link to your email.</p>
    <form method="post">
      {% csrf_token %}
      <label style="font-size:13px;font-weight:600;color:var(--tf-navy);">Email</label>
      {{ form.email }}
      <button type="submit" class="sp-btn sp-btn-primary" style="width:100%;justify-content:center;margin-top:16px;">Send link</button>
    </form>
    <p style="margin-top:16px;font-size:13px;"><a href="{% url 'login' %}" style="color:var(--tf-blue);">Back to sign in</a></p>
  </div>
</div>
{% endblock %}
