{% extends "core/base.html" %}
{% load i18n %}
{% block title %}{% trans "Nueva contraseña" %} — TradeFlow{% endblock %}
{% block content %}
<div style="max-width:440px;margin:48px auto;padding:0 24px;">
  <div class="sp-card" style="padding:28px;">
    <h1 style="font-family:'DM Serif Display',serif;color:var(--tf-navy);margin:0 0 16px;">{% trans "Nueva contraseña" %}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.new_password1.errors }}
      {{ form.new_password2.errors }}
      <label class="tf-input" style="display:block;margin-bottom:8px;">{% trans "Contraseña" %}</label>
      <input type="password" name="new_password1" class="tf-input" required style="width:100%;margin-bottom:12px;">
      <label>{% trans "Confirmar" %}</label>
      <input type="password" name="new_password2" class="tf-input" required style="width:100%;margin:16px 0 20px;">
      <button type="submit" class="sp-btn sp-btn-primary" style="width:100%;">{% trans "Guardar" %}</button>
    </form>
  </div>
</div>
{% endblock %}
