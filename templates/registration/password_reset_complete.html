{% extends "core/base.html" %}
{% load i18n %}
{% block title %}{% trans "Contraseña actualizada" %} — TradeFlow{% endblock %}
{% block content %}
<div style="max-width:440px;margin:48px auto;padding:0 24px;">
  <div class="sp-card" style="padding:28px;text-align:center;">
    <h1 style="font-family:'DM Serif Display',serif;color:var(--tf-navy);">{% trans "Listo" %}</h1>
    <p style="color:var(--tf-muted);">{% trans "Tu contraseña fue actualizada. Ya puedes iniciar sesión." %}</p>
    <a href="{% url 'login' %}" class="sp-btn sp-btn-primary" style="margin-top:16px;">{% trans "Iniciar sesión" %}</a>
  </div>
</div>
{% endblock %}
