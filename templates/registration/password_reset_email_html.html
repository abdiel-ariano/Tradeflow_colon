<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reset password — TradeFlow Colón</title>
</head>
<body style="margin:0;padding:24px;background:#F2F3F5;font-family:system-ui,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center">
    <table role="presentation" width="100%" style="max-width:520px;background:#fff;border-radius:12px;overflow:hidden;">
      <tr><td style="background:#0F2A44;padding:24px;text-align:center;">
        <img src="{{ public_base_url|default:'' }}/static/img/logo-icon-color.png" alt="TradeFlow Colón" style="height:48px;width:auto;">
      </td></tr>
      <tr><td style="padding:28px 24px;">
        <h1 style="margin:0 0 12px;font-size:20px;font-weight:600;">Reset password</h1>
        <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#425466;">We received a request to reset access to your TradeFlow Colón account.</p>
        <p style="margin:0 0 20px;">
          <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;padding:12px 24px;background:#FF6B35;color:#fff;text-decoration:none;border-radius:8px;font-weight:600;font-size:15px;">Create new password</a>
        </p>
        <p style="margin:0;font-size:13px;color:#6B7A88;line-height:1.5;">If you did not request this, ignore this message. The link expires for security.</p>
      </td></tr>
      <tr><td style="padding:16px 24px;background:#F9FAFB;font-size:12px;color:#6B7A88;text-align:center;">
        TradeFlow Colón · Colón Free Zone · Panama
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>
