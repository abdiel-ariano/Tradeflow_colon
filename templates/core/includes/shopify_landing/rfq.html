{% load static %}
<section class="sh-section hm-shopify__container" aria-labelledby="sh-rfq-title">
  <div class="sh-rfq">
    <div class="sh-rfq__copy">
      <div class="sh-rfq__icons" aria-hidden="true">
        <span class="sh-rfq__icon">RFQ</span>
        <span class="sh-rfq__icon">✓</span>
        <span class="sh-rfq__icon">📦</span>
      </div>
      <div>
        <h2 class="sh-rfq__title" id="sh-rfq-title">Your catalog has<br>entered the chat</h2>
        <p class="sh-rfq__text">Buyers discover verified SKUs, send RFQs, and track orders — all powered by TradeFlow Colón's B2B marketplace and inquiry workflow.</p>
      </div>
      <a href="{% url 'catalogo_publico' %}" class="sh-btn-pill sh-btn-pill--orange">Browse catalog</a>
    </div>
    <div class="sh-rfq__media">
      <img src="{% static 'images/shopify-landing/rfq-chat.jpg' %}" alt="" loading="lazy" decoding="async" role="presentation">
    </div>
  </div>
</section>
