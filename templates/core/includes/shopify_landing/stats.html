{% comment %}Template: core/includes/shopify_landing/stats.html — review purpose and context vars.{% endcomment %}
<section class="hm-shopify__container sh-stats" aria-label="TradeFlow marketplace stats">
  <div class="sh-stat">
    <strong>{{ stats.productos|default:0 }}</strong>
    <span>Active SKUs</span>
  </div>
  <div class="sh-stat">
    <strong>{{ stats.empresas|default:0 }}</strong>
    <span>Verified companies</span>
  </div>
  <div class="sh-stat">
    <strong>40+</strong>
    <span>Buyer countries</span>
  </div>
  <div class="sh-stat">
    <strong>RFQ</strong>
    <span>Request for quotation</span>
  </div>
</section>
