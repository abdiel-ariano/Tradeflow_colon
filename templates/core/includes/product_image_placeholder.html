{% comment %}
ProductImage — reusable product image with local SVG fallback on missing URL or load error.
{% endcomment %}
{% load static tf_media %}
{% with image_src=product|product_image_src %}
<img src="{% if image_src %}{{ image_src }}{% else %}{% static 'images/placeholder-producto.svg' %}{% endif %}"
     alt="{{ alt|default:product.name }}"
     class="product-img{% if img_class %} {{ img_class }}{% endif %}{% if css_class %} {{ css_class }}{% endif %}"
     loading="lazy"
     decoding="async"
     {% if width %}width="{{ width }}"{% endif %}
     {% if height %}height="{{ height }}"{% endif %}
     data-tf-product-image
     onerror="this.onerror=null;this.src='{% static 'images/placeholder-producto.svg' %}';this.classList.add('is-placeholder');">
{% endwith %}
