{% comment %}Template: core/includes/auth_lang_switcher.html — ES/EN for auth-only layouts.{% endcomment %}
{% load i18n tf_catalog %}
{% get_current_language as CURRENT_LANG %}
<div class="auth-lang-switch" role="group" aria-label="{% trans 'Language' %}">
  <form action="{% url 'set_language' %}" method="post" class="auth-lang-switch__form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{% tf_language_next 'es' %}">
    <input type="hidden" name="language" value="es">
    <button type="submit" class="auth-lang-switch__btn{% if CURRENT_LANG == 'es' %} is-active{% endif %}" lang="es">ES</button>
  </form>
  <span class="auth-lang-switch__sep" aria-hidden="true">|</span>
  <form action="{% url 'set_language' %}" method="post" class="auth-lang-switch__form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{% tf_language_next 'en' %}">
    <input type="hidden" name="language" value="en">
    <button type="submit" class="auth-lang-switch__btn{% if CURRENT_LANG == 'en' %} is-active{% endif %}" lang="en">EN</button>
  </form>
</div>
