{% comment %}Marketplace search row — Alibaba/Shopify-style wholesale discovery.{% endcomment %}
<section class="hm-mkt-search" aria-label="Search wholesale catalog">
  <div class="hm-mkt-search__inner">
    <form class="hm-mkt-search__form" action="{% url 'catalogo_publico' %}" method="get" role="search">
      <label class="visually-hidden" for="hm-mkt-search-input">Search products, suppliers, or categories</label>
      <div class="hm-mkt-search__bar">
        <input
          type="search"
          id="hm-mkt-search-input"
          name="buscar"
          class="hm-mkt-search__input"
          placeholder="Search products, suppliers, or categories in the Free Zone"
          autocomplete="off"
        >
        <button type="submit" class="hm-mkt-search__btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <span class="hm-mkt-search__btn-label">Search</span>
        </button>
      </div>
    </form>
    <div class="hm-mkt-search__chips" aria-label="Popular categories">
      <span class="hm-mkt-search__chips-label">Trending:</span>
      {% for cat in marketplace_trending_categories|default:"" %}
      <a href="{% url 'catalogo_publico' %}?categoria={{ cat.pk }}" class="hm-mkt-search__chip">{{ cat.name }}</a>
      {% empty %}
      <a href="{% url 'catalogo_publico' %}?categoria=1" class="hm-mkt-search__chip">Electronics</a>
      <a href="{% url 'catalogo_publico' %}" class="hm-mkt-search__chip">Office supplies</a>
      <a href="{% url 'catalogo_publico' %}?orden=promo" class="hm-mkt-search__chip">Deals</a>
      <a href="{% url 'catalogo_publico' %}?verificado=1" class="hm-mkt-search__chip">Verified suppliers</a>
      {% endfor %}
    </div>
  </div>
</section>
