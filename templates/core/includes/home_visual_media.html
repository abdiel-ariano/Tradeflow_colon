{% comment %}
Home marketplace visuals — catalog-seed photos for dimension reference (not SVG icons).
{% endcomment %}
{% load static tf_media %}
{% with primary=product|marketplace_visual_image_src picsum=product|product_image_picsum_src focal=product|product_image_object_position %}
<div class="hm-visual is-loaded{% if wrap_class %} {{ wrap_class }}{% endif %}" data-hm-media>
  <img src="{{ primary }}"
       alt="{% if decorative %}{% else %}{{ alt|default:product.name }}{% endif %}"
       class="hm-visual__img{% if product_card_img %} product-img{% endif %}{% if img_class %} {{ img_class }}{% endif %}{% if decorative %} is-decorative{% endif %}"
       loading="{{ loading|default:'lazy' }}"
       decoding="async"
       style="object-fit: {{ object_fit|default:'cover' }}; object-position: {{ focal }};"
       {% if decorative %}role="presentation"{% endif %}
       {% if width %}width="{{ width }}"{% endif %}
       {% if height %}height="{{ height }}"{% endif %}
       data-tf-product-image
       {% if picsum %}data-hm-picsum="{{ picsum }}"{% endif %}
       data-hm-static="{% static 'images/home-product-fallback.svg' %}"
       data-hm-fallback-stage="0">
</div>
{% endwith %}
