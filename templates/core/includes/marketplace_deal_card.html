{% load i18n %}
<div class="mkt-deal-wrap{% if card_extra_class %} {{ card_extra_class }}{% endif %}" data-product-id="{{ product.pk }}">
  {% if not product.is_on_promo_now %}
  <span class="mkt-deal-wrap__badge">{% trans "Wholesale pick" %}</span>
  {% endif %}
  {% include "core/includes/catalogo_card.html" with product=product card_index=card_index|default:99 card_extra_class="mkt-deal-product-card" %}
</div>
