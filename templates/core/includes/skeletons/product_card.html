{% comment %}Skeleton de una tarjeta de producto (.tf-pcard). aria-hidden en capa padre.{% endcomment %}
<article class="tf-skeleton-card" aria-hidden="true">
  <div class="tf-skeleton tf-skeleton-img"></div>
  <div class="tf-skeleton-card__body">
    <div class="tf-skeleton tf-skeleton-text tf-skeleton-text--sm"></div>
    <div class="tf-skeleton tf-skeleton-text tf-skeleton-text--lg"></div>
    <div class="tf-skeleton tf-skeleton-text" style="width:42%;"></div>
    <div class="tf-skeleton tf-skeleton-text tf-skeleton-text--btn"></div>
  </div>
</article>
