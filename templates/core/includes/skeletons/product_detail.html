{% comment %}Skeleton de detalle de producto (imagen + info).{% endcomment %}
<div class="tf-skeleton-detail" aria-hidden="true">
  <div class="tf-skeleton tf-skeleton-img" style="aspect-ratio:4/3;min-height:240px;"></div>
  <div class="tf-skeleton-detail__info">
    <div class="tf-skeleton tf-skeleton-text tf-skeleton-text--sm" style="width:38%;"></div>
    <div class="tf-skeleton tf-skeleton-text tf-skeleton-text--lg"></div>
    <div class="tf-skeleton-detail__badges">
      <div class="tf-skeleton tf-skeleton-detail__badge"></div>
      <div class="tf-skeleton tf-skeleton-detail__badge" style="width:100px;"></div>
      <div class="tf-skeleton tf-skeleton-detail__badge" style="width:140px;"></div>
    </div>
    <div class="tf-skeleton tf-skeleton-text" style="width:45%;height:1.5em;"></div>
    <div class="tf-skeleton tf-skeleton-text tf-skeleton-text--btn" style="max-width:200px;"></div>
    <div class="tf-skeleton tf-skeleton-text tf-skeleton-text--btn" style="max-width:180px;"></div>
  </div>
</div>
