<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeFlow — Maintenance</title>
  <style>
    :root { color-scheme: light; font-family: Montserrat, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f3f5; color: #111318; }
    main { max-width: 520px; padding: 32px 20px; text-align: center; }
    h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 12px; }
    p { color: #6b7a88; line-height: 1.6; margin: 0 0 24px; }
    a { display: inline-block; padding: 12px 20px; border-radius: 999px; background: #0057a8; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p style="letter-spacing:.08em;text-transform:uppercase;font-size:11px;font-weight:700;color:#f26522;">Temporary maintenance</p>
    <h1>Reconnecting to the marketplace database</h1>
    <p>TradeFlow is restoring its connection to the Colón Free Zone catalog. Please retry in a minute.</p>
    <a href="/">Retry</a>
  </main>
</body>
</html>
