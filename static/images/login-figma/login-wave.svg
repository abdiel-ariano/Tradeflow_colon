<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <mask id="wave-alpha-mask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse">
      <image href="bg-wave.png" xlink:href="bg-wave.png" x="0" y="0" width="1920" height="1200" preserveAspectRatio="xMidYMax slice"/>
    </mask>

    <linearGradient id="grad-blue-violet" gradientUnits="userSpaceOnUse" x1="500" y1="0" x2="1700" y2="1200">
      <stop offset="0%" stop-color="#2E5B8A">
        <animate attributeName="stop-color" values="#2E5B8A;#4A8FD4;#0057A8;#2E5B8A" dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7B4BB8">
        <animate attributeName="stop-color" values="#7B4BB8;#9B6BD8;#5B3BA8;#7B4BB8" dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A0C0E8">
        <animate attributeName="stop-color" values="#A0C0E8;#C8D8F8;#88A8D0;#A0C0E8" dur="18s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 140 -70; -90 100; 70 50; 0 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="grad-violet-orange" gradientUnits="userSpaceOnUse" x1="700" y1="0" x2="1850" y2="1200">
      <stop offset="0%" stop-color="#9B6BD8">
        <animate attributeName="stop-color" values="#9B6BD8;#B88BF0;#7B4BB8;#9B6BD8" dur="22s" repeatCount="indefinite"/>
      </stop>
      <stop offset="45%" stop-color="#E080C0">
        <animate attributeName="stop-color" values="#E080C0;#F0A0D8;#D060A8;#E080C0" dur="22s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F26522">
        <animate attributeName="stop-color" values="#F26522;#FF8530;#E05010;#F26522" dur="22s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; -120 80; 100 -60; -80 -100; 0 0" dur="22s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="grad-orange-red" gradientUnits="userSpaceOnUse" x1="850" y1="0" x2="1920" y2="1200">
      <stop offset="0%" stop-color="#E08000">
        <animate attributeName="stop-color" values="#E08000;#FFB030;#D06000;#E08000" dur="22s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#E08080">
        <animate attributeName="stop-color" values="#E08080;#FFA0A0;#D06060;#E08080" dur="22s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#E060A0">
        <animate attributeName="stop-color" values="#E060A0;#FF80C0;#C04080;#E060A0" dur="22s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 80 110; -100 50; 60 -80; 0 0" dur="22s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="grad-red-fuchsia" gradientUnits="userSpaceOnUse" x1="950" y1="0" x2="1920" y2="1200">
      <stop offset="0%" stop-color="#E08080">
        <animate attributeName="stop-color" values="#E08080;#FF9090;#D06070;#E08080" dur="26s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#E080A0">
        <animate attributeName="stop-color" values="#E080A0;#FFA0C0;#D06080;#E080A0" dur="26s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#E080E0">
        <animate attributeName="stop-color" values="#E080E0;#FFA0FF;#D060C0;#E080E0" dur="26s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; -80 -100; 120 60; -50 90; 0 0" dur="26s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="liquid-texture" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.045" numOctaves="2" seed="4" result="noise">
        <animate attributeName="baseFrequency" values="0.009 0.045;0.013 0.062;0.007 0.038;0.009 0.045" dur="30s" repeatCount="indefinite"/>
        <animate attributeName="seed" values="4;8;2;6;4" dur="30s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g mask="url(#wave-alpha-mask)">
    <g filter="url(#liquid-texture)">
      <rect x="0" y="0" width="1920" height="1200" fill="url(#grad-blue-violet)" opacity="0.92"/>
      <rect x="0" y="0" width="1920" height="1200" fill="url(#grad-violet-orange)" opacity="0.78"/>
      <rect x="0" y="0" width="1920" height="1200" fill="url(#grad-orange-red)" opacity="0.72"/>
      <rect x="0" y="0" width="1920" height="1200" fill="url(#grad-red-fuchsia)" opacity="0.68"/>
    </g>
  </g>
</svg>
