<script nonce="{{ csp_nonce }}" src="{% url 'analytics:plotlyjs' %}"></script>
<script nonce="{{ csp_nonce }}">
(function () {
  // ── Tabs de fuente de datos ──────────────────────────────────────────
  document.querySelectorAll('.an-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      var target = tab.getAttribute('data-panel');
      document.querySelectorAll('.an-tab').forEach(function (t) { t.classList.remove('is-active'); });
      document.querySelectorAll('.an-panel').forEach(function (p) {
        p.classList.toggle('is-active', p.getAttribute('data-panel') === target);
      });
      tab.classList.add('is-active');
    });
  });

  {% if has_data %}
  // ── Render de gráficas del dashboard ───────────────────────────────
  var UI_EN = {% if seller_embedded %}true{% else %}false{% endif %};

  function renderChartGrid(dataElId, gridId, idPrefix) {
    var dataEl = document.getElementById(dataElId);
    var grid = document.getElementById(gridId);
    if (!grid) return;
    var charts = [];
    try { charts = JSON.parse((dataEl && dataEl.textContent) || '[]'); } catch (e) { charts = []; }
    grid.innerHTML = '';
    charts.forEach(function (item, i) {
      var card = document.createElement('div');
      card.className = 'an-card' + (idPrefix === 'an-fchart-' ? ' an-forecast-chart-card' : '');
      var title = document.createElement('div');
      title.className = 'an-chart-title';
      title.textContent = item.title;
      var plot = document.createElement('div');
      plot.className = 'an-chart';
      plot.id = idPrefix + i;
      card.appendChild(title);
      card.appendChild(plot);
      grid.appendChild(card);
      try {
        var fig = JSON.parse(item.fig);
        if (fig.layout) {
          // El card ya muestra el título; no dejar anotaciones de título Plotly.
          fig.layout.title = { text: '' };
          var m = Object.assign({}, fig.layout.margin || {});
          // t/r mínimos: evita cortar ticks o el borde del plot en 2 columnas.
          m.t = Math.min(Math.max(m.t || 28, 20), 36);
          m.r = Math.max(m.r || 28, 28);
          fig.layout.margin = m;
          // Anotaciones de referencia (Media/Mediana legacy) fuera del card.
          if (Array.isArray(fig.layout.annotations)) {
            fig.layout.annotations = fig.layout.annotations.filter(function (a) {
              var t = (a && a.text) ? String(a.text) : '';
              return !(t.indexOf('Media:') === 0 || t.indexOf('Mediana:') === 0);
            });
          }
        }
        Plotly.newPlot(plot, fig.data, fig.layout, { displayModeBar: false, responsive: true });
      } catch (e) {
        plot.textContent = UI_EN ? 'Could not render this chart.' : 'No se pudo renderizar la gráfica.';
      }
    });
  }

  renderChartGrid('an-charts-data', 'an-charts', 'an-chart-');
  renderChartGrid('an-forecast-charts-data', 'an-forecast-charts', 'an-fchart-');

  // ── Chat ───────────────────────────────────────────────────────────
  var CHAT_URL = "{% url 'analytics:chat' %}";
  var CSRF = "{{ csrf_token }}";
  var msgs = document.getElementById('an-chat-msgs');
  var input = document.getElementById('an-chat-input');
  var sendBtn = document.getElementById('an-chat-send');
  var history = [];
  var busy = false;

  function scrollDown() { msgs.scrollTop = msgs.scrollHeight; }

  function bubble(text, cls) {
    var d = document.createElement('div');
    d.className = 'an-bubble ' + cls;
    d.textContent = text;
    msgs.appendChild(d); scrollDown();
    return d;
  }

  function send() {
    if (busy) return;
    var msg = (input.value || '').trim();
    if (!msg) return;
    input.value = '';
    busy = true;
    bubble(msg, 'an-bubble-user');
    history.push({ role: 'user', content: msg });
    var loading = bubble('…', 'an-bubble-bot');

    fetch(CHAT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
      body: JSON.stringify({ message: msg, history: history.slice(-6) })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      loading.remove();
      if (d.text) { bubble(d.text, 'an-bubble-bot'); history.push({ role: 'assistant', content: d.text }); }
      if (d.fig) {
        var wrap = document.createElement('div');
        wrap.className = 'an-bubble an-bubble-fig';
        wrap.style.padding = '8px';
        var plot = document.createElement('div'); plot.style.minHeight = '360px';
        wrap.appendChild(plot); msgs.appendChild(wrap);
        try { var f = JSON.parse(d.fig); Plotly.newPlot(plot, f.data, f.layout, { displayModeBar: true, responsive: true }); } catch (e) {}
        history.push({ role: 'assistant', content: UI_EN ? '(chart generated)' : '(gráfica generada)' });
        scrollDown();
      }
      if (d.table) {
        var t = document.createElement('div');
        t.className = 'an-bubble an-bubble-table an-table-scroll';
        t.innerHTML = d.table;
        msgs.appendChild(t);
        history.push({ role: 'assistant', content: UI_EN ? '(table generated)' : '(tabla generada)' });
        scrollDown();
      }
    })
    .catch(function () {
      loading.remove();
      bubble(UI_EN ? 'Connection error.' : 'Error de conexión.', 'an-bubble-bot');
    })
    .finally(function () { busy = false; });
  }

  if (sendBtn) sendBtn.addEventListener('click', send);
  if (input) input.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });

  document.querySelectorAll('.an-ex').forEach(function (ex) {
    ex.addEventListener('click', function () { input.value = ex.textContent; input.focus(); });
  });
  {% endif %}
})();
</script>
