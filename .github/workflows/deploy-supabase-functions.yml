name: Deploy Supabase Edge Functions

# Despliega la(s) Edge Function(s) de Supabase automáticamente al mergear a
# master (no requiere correr la CLI localmente). También se puede disparar a
# mano desde la pestaña "Actions" → "Run workflow".
on:
  push:
    branches: [master]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy send-transactional-email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DEFAULT_FROM_NAME: ${{ secrets.DEFAULT_FROM_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "::error::Faltan los secrets del repo SUPABASE_ACCESS_TOKEN y/o SUPABASE_PROJECT_REF."
            exit 1
          fi

          # Si pones GMAIL_USER + GMAIL_APP_PASSWORD como secrets del repo, se
          # configuran en la función. Si prefieres, ponlos una sola vez en el
          # Dashboard de Supabase y omite estos secrets (se salta este paso).
          if [ -n "${GMAIL_USER}" ] && [ -n "${GMAIL_APP_PASSWORD}" ]; then
            echo "Configurando secrets de la Edge Function…"
            if [ -n "${DEFAULT_FROM_NAME}" ]; then
              supabase secrets set --project-ref "${SUPABASE_PROJECT_REF}" \
                GMAIL_USER="${GMAIL_USER}" \
                GMAIL_APP_PASSWORD="${GMAIL_APP_PASSWORD}" \
                DEFAULT_FROM_NAME="${DEFAULT_FROM_NAME}"
            else
              supabase secrets set --project-ref "${SUPABASE_PROJECT_REF}" \
                GMAIL_USER="${GMAIL_USER}" \
                GMAIL_APP_PASSWORD="${GMAIL_APP_PASSWORD}"
            fi
          else
            echo "GMAIL_USER/GMAIL_APP_PASSWORD no provistos como secrets del repo; se asume que ya están en Supabase."
          fi

          # Deploy con verificación JWT por defecto (Django usa la service_role key).
          supabase functions deploy send-transactional-email \
            --project-ref "${SUPABASE_PROJECT_REF}"

          echo "✅ Edge Function desplegada."
