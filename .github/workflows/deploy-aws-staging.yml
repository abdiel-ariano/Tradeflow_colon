name: Deploy AWS staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradeflow-aws-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    environment: aws-staging
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: tradeflow-colon
      EC2_INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Sign in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -Eeuo pipefail
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --tag "$image_uri" \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:staging" \
            --push \
            .
          echo "uri=$image_uri" >>"$GITHUB_OUTPUT"

      - name: Deploy through AWS Systems Manager
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$EC2_INSTANCE_ID" ]]; then
            echo 'Missing AWS_EC2_INSTANCE_ID in the aws-staging environment.' >&2
            exit 1
          fi
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy TradeFlow ${GITHUB_SHA}" \
            --parameters "commands=sudo /usr/local/bin/tradeflow-deploy.sh '$IMAGE_URI'" \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
